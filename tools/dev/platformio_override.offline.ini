; Copy to the repo root as platformio_override.ini (which is gitignored).
;
; The PlatformIO package registry (api/dl.registry.platformio.org) is unreachable
; from this sandbox, so every library normally pulled by registry name is pinned
; to the equivalent GitHub tag instead. Versions match platformio.ini exactly.

[env]
lib_deps =
    https://github.com/crankyoldgit/IRremoteESP8266.git#v2.9.0
    ESPAsyncWebServerWLED = git+https://github.com/Aircoookie/ESPAsyncWebServer#ac44e32abf2a69ae650412fb6bc193c59ccac38a
    https://github.com/marvinroger/async-mqtt-client.git#v0.9.0

[esp32_all_variants]
lib_deps =
    https://github.com/kosme/arduinoFFT.git#v2.0.1
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/bitbank2/AnimatedGIF.git#1.4.7
    https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e

[platformio]
; lib/NeoESP32RmtHI is excluded from this mirror: its library.json pins
; makuna/NeoPixelBus by registry name, which cannot be resolved here. The V5
; esp32 envs put it in lib_ignore anyway, but PlatformIO reads its declared
; dependencies before lib_ignore is applied.
lib_dir = .pio/liblocal
